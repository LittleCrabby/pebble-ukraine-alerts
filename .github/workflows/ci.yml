name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (optional, e.g. v1.0.0; defaults to package.json version)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run C and PKJS tests
        run: |
          npm test

  build:
    name: Build PBW
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Pebble Tool
        run: |
          python -m pip install --upgrade pip
          pip install pebble-tool

      - name: Cache Pebble SDK
        id: cache-pebble-sdk
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pebble-sdk
          key: pebble-sdk-4.33.1-${{ runner.os }}

      - name: Install / Activate Pebble SDK
        run: |
          pebble sdk activate 4.33.1 2>/dev/null || pebble sdk install 4.33.1

      - name: Build Pebble App (.pbw)
        run: |
          pebble build

      - name: Upload PBW Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pebble-ukraine-alerts.pbw
          path: build/pebble-ukraine-alerts.pbw
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [test, build]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download built PBW artifact
        uses: actions/download-artifact@v4
        with:
          name: pebble-ukraine-alerts.pbw
          path: build

      - name: Determine Release Tag
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Create a versioned copy of the pbw asset
          cp build/pebble-ukraine-alerts.pbw "build/pebble-ukraine-alerts-${TAG}.pbw"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Ukraine Alerts Map ${{ steps.release_meta.outputs.tag }}
          files: |
            build/pebble-ukraine-alerts-${{ steps.release_meta.outputs.tag }}.pbw
          generate_release_notes: true
          draft: false
          prerelease: false
